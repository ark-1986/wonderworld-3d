name: Build WonderWorld 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'godot/**'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Move assets into godot/assets for APK build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/godot/assets"
          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            mv "$GITHUB_WORKSPACE/icon.png" "$GITHUB_WORKSPACE/godot/assets/icon.png"
          fi
          if [ -f "$GITHUB_WORKSPACE/coin.wav" ]; then
            mv "$GITHUB_WORKSPACE/coin.wav" "$GITHUB_WORKSPACE/godot/assets/coin.wav"
          fi
          if [ -f "$GITHUB_WORKSPACE/happy_loop.wav" ]; then
            mv "$GITHUB_WORKSPACE/happy_loop.wav" "$GITHUB_WORKSPACE/godot/assets/happy_loop.wav"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install free Android SDK dependencies
        run: |
          set -euo pipefail
          echo "Android SDK: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest" /tmp/ww-android-cmd
          curl -fL --retry 3 -o /tmp/ww-cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  /tmp/ww-cmd.zip' | sha256sum -c -
          unzip -q /tmp/ww-cmd.zip -d /tmp/ww-android-cmd
          cp -a /tmp/ww-android-cmd/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' 'ndk;28.1.13356709' 'cmake;3.10.2.4988404'


      - name: Download official Godot 4.5.2 editor and export templates
        run: |
          mkdir -p "$GITHUB_WORKSPACE/godot-bin" "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          curl --fail -L --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$GITHUB_WORKSPACE/godot-bin"
          chmod +x "$GITHUB_WORKSPACE/godot-bin/Godot_v4.5.2-stable_linux.x86_64"
          curl --fail -L --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz
          mkdir -p /tmp/templates-unpacked
          unzip -q /tmp/templates.tpz -d /tmp/templates-unpacked
          cp -R /tmp/templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Generate a local debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import resources and export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: "{{ github.workspace }}/.android/debug.keystore"
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          # Godot 4.5 reads JAVA_HOME and ANDROID_HOME automatically when available.
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GITHUB_WORKSPACE/godot-bin/Godot_v4.5.2-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE/godot" --editor --quit
          "$GITHUB_WORKSPACE/godot-bin/Godot_v4.5.2-stable_linux.x86_64" --headless --path "$GITHUB_WORKSPACE/godot" --export-debug Android "$GITHUB_WORKSPACE/build/WonderWorld3D-debug.apk"
          test -s "$GITHUB_WORKSPACE/build/WonderWorld3D-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WonderWorld3D-Android-debug-APK
          path: build/WonderWorld3D-debug.apk
          retention-days: 7
